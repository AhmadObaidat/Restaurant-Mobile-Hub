kind = "mobile"
previewPath = "/"
title = "Amman Coffee House"
description = "A reusable, white-label customer mobile app for Jordanian restaurants and coffee shops, demonstrated with Amman Coffee House. Customers can browse a branded menu, manage a cart, place a clearly simulated order, and explore loyalty rewards in Arabic or English."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
